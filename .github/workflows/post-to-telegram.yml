name: Post to Telegram
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post text
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse
          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]; CHAT = "-1004380165542"
          texts = [
            "Красивые волосы начинаются с заботы. В ara studio в Бресте подберём уход именно под тебя — запишись и почувствуй разницу.",
            "Новый образ меняет настроение. Хочешь освежить стрижку или цвет? Ждём тебя в ara studio, Брест. Запись — в директ.",
            "Не жди особого повода, чтобы нравиться себе. Приходи в ara studio в Бресте — сделаем красиво уже сегодня.",
            "Тусклый цвет? Подберём окрашивание, которое подчеркнёт именно тебя. ara studio, Брест.",
            "Укладка, которая держится весь день — это техника и правильный уход. Научим и сделаем. ara studio, Брест.",
            "Здоровые, блестящие волосы — наша работа. Запишись в ara studio в Бресте и доверься мастеру.",
            "Стрижка под форму лица молодит лучше любого крема. Подберём твою в ara studio, Брест.",
            "Свободные окошки на этой неделе есть! Освежи образ в ara studio, Брест. Запись — в директ.",
            "Окрашивание без вреда — это реально, когда за дело берётся профи. ara studio, Брест.",
            "Каждая деталь — про тебя: уход, цвет, форма. Приходи — и увидишь результат в зеркале. ara studio, Брест.",
            "Волосы любят заботу каждый день. Подскажем домашний уход и подберём средства. ara studio, Брест.",
            "Хочешь тот самый «дорогой» вид волос? Начни с записи в ara studio, Брест.",
          ]
          i = int(time.time() // 300) % len(texts)
          data = urllib.parse.urlencode({"chat_id": CHAT, "text": texts[i], "parse_mode": "HTML", "disable_web_page_preview": "true"}).encode()
          r = urllib.request.urlopen(f"https://api.telegram.org/bot{TOKEN}/sendMessage", data=data)
          print(json.loads(r.read()).get("ok"))
          PY
