name: Post to Telegram
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post photo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse
          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]; CHAT = "-1004380165542"
          BASE = "https://raw.githubusercontent.com/Metropoliya/AI/48f7c9ab8395252fe24f7d44bc74c1fc4d058486/images/"
          posts = [
            ("post0.jpg", "Красивые волосы начинаются с правильного ухода. Подберём твой образ и домашний уход. ara studio, Брест — запись в директ 💇‍♀️"),
            ("post1.jpg", "Здоровый блеск волос — это регулярный уход и хороший мастер. Приходи в ara studio, Брест. Запись — в директ ✨"),
            ("post2.jpg", "Твой идеальный цвет волос подберём индивидуально — бережно и стильно. ara studio, Брест. Запись — в директ 🎨"),
            ("post3.jpg", "Окрашивание без вреда — реально, когда работает профи. Доверься мастеру ara studio, Брест. Запись — в директ"),
            ("post4.jpg", "Укладка, которая держится весь день — дело техники и ухода. Научим и сделаем. ara studio, Брест. Запись — в директ"),
            ("post5.jpg", "Новый образ — новое настроение. Освежи стрижку или цвет в ara studio, Брест. Запись — в директ 💫"),
          ]
          fn, cap = posts[int(time.time() // 300) % len(posts)]
          data = urllib.parse.urlencode({"chat_id": CHAT, "photo": BASE + fn, "caption": cap, "parse_mode": "HTML"}).encode()
          r = urllib.request.urlopen(f"https://api.telegram.org/bot{TOKEN}/sendPhoto", data=data)
          print(json.loads(r.read()).get("ok"))
          PY
